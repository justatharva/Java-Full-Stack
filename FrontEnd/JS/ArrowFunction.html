<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    <script>
        function hello(){
            document.write("This is normal function."+"<br>")
        }
        hello();

        let show = (name,age)=>document.write(`This is Arrow Function.<br>Welcome ${name} <br> Age Is : ${age}`)
        show("Atharva",23);
    </script>
</body>
</html>
