<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
    <style>
        h2{
            background-color: aqua;
            color: aliceblue;
            text-align: center;
            padding: 20px;
            margin: 45px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1 style="background-color: black; color: white;">This is inline CSS</h1>
    <h2>This is internal CSS</h2>
</body>
</html>
