<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
</head>
<body>
    <h1>This is box model</h1>
    <h3 style="border-style: dashed; background-color: aquamarine; border-color: blue; padding: 20px;">Dashed</h3>
    <h3 style="border-style: dotted;">Dotted</h3>
    <h3 style="border-style: double;">Double</h3>
    <h3 style="border-style: groove;">Groove</h3>
    <h3 style="border-style: hidden;">Hidden</h3>
    <h3 style="border-style: none;">None</h3>
    <h3 style="border-style: inset;">Inset</h3>
    <h3 style="border-style: outset;">Outset</h3>
    <h3 style="border-style: ridge;">Ridge</h3>
    <h3 style="border-style: solid;">Solid</h3>
</body>
</html>
