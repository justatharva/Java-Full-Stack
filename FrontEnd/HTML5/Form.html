<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <h1>User information form</h1>
    <label for="name">Enter Name : </label>
    <input type="text" id="name">
    <br><br>
    <label for="email">Enter Email : </label>
    <input type="email" id="email">
    <br><br>
    <input type="submit" value="Submit">
    <label for="choice">Select Choice</label>
    <input type="checkbox" id="choice">
    <br><br>
    <label for="color">Select Color</label>
    <input type="color"  id="color">
    <label for="date">Select Date</label>
    <input type="date" id="date">
    <br><br>
    <label for="date&time">Enter Date & Time</label>
    <input type="datetime-local" id="date&time">
    <br><br>
    <label for="file">Upload File</label>
    <input type="file" id="file">
    <br><br>
    <label for="hidden">This is Hidden Property</label>
    <input type="hidden" name="hidden">
    <br><br>
    <label for="img">Image</label>
    <input type="image" src="Images/Mahadev.jpg" width="50%" alt="#">
    <br><br>
    <label for="radio">Select Gender</label>
    <input type="radio" name="Male" id="Male">Male
    <input type="radio" name="Female" id="Female">Female
    <br><br>
    <label for="range">Range</label>
    <input type="range" id="range">
    <br><br>
    <label for="search">Search Here</label>
    <input type="search" id="search">
    <br><br>
    <label for="url">URL</label>
    <input type="url" id="url">
    <br><br>
</body>
</html>
